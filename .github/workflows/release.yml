name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  BIN_NAME: ssj
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version ($pkg_version)"
            exit 1
          fi
  build:
    needs: check-version
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build with cargo-zigbuild
        if: matrix.zig
        # the gnu builds are linked against glibc 2.17, which `ssj install` relies on (MIN_GLIBC); the
        # files stay in the directory of the target without the version
        run: |
          target="${{ matrix.target }}"
          case "$target" in *-gnu) zig_target="$target.2.17" ;; *) zig_target="$target" ;; esac
          cargo zigbuild --release -p ssj-client -p ssj-server --target "$zig_target"
      - name: Build natively
        if: ${{ !matrix.zig }}
        run: cargo build --release -p ssj-client -p ssj-server --target ${{ matrix.target }}
      - name: Package binaries
        run: |
          cp "target/${{ matrix.target }}/release/ssj" "ssj-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/ssj-server" "ssj-server-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ssj-*
          retention-days: 1
      # the man page and the completions are the same on every target, so one build supplies them
      - name: Collect the man page and the completions
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo run --release -p ssj-assets -- assets
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: assets
          path: assets
          retention-days: 1
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # for the README and the license that go into the archives
      - uses: actions/checkout@v7
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Download the man page and the completions
        uses: actions/download-artifact@v8
        with:
          name: assets
          path: assets
      # one archive for each platform of the client. The server files are separate assets of the
      # release, which `ssj install` downloads.
      - name: Assemble the archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          # artifacts lose the executable bit on their way between jobs
          chmod +x dist/*
          mkdir -p out
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin; do
            name="ssj-${version}-${target}"
            mkdir -p "pack/$name"
            cp "dist/ssj-${target}" "pack/$name/ssj"
            cp assets/ssj.1 "pack/$name/"
            cp -r assets/completions "pack/$name/"
            cp README.md LICENSE "pack/$name/"
            tar -C pack -czf "out/${name}.tar.gz" "$name"
          done
          cp dist/ssj-server-* out/
      - name: Write checksums
        run: cd out && sha256sum * > SHA256SUMS
      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "out/*"
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
