[package]
name = "ssj-server"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "usage"] }
confique.workspace = true
pty-process = { workspace = true, features = ["async"] }
quinn.workspace = true
rustix = { workspace = true, features = ["fs", "process", "stdio", "system", "termios"] }
serde.workspace = true
socket2 = { workspace = true, features = ["all"] }
ssj-config.workspace = true
ssj-net.workspace = true
ssj-proto.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true
